<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("/service-worker.js");
}

const resultOverlay = document.createElement("div");
resultOverlay.id = "ai-result";
resultOverlay.style.cssText = "display:none;position:fixed;inset:0;background:rgba(28,28,25,0.85);z-index:100;overflow-y:auto;padding:24px;";
document.body.appendChild(resultOverlay);

function showLoading() {
  resultOverlay.innerHTML = '<div style="background:#fcf9f4;border-radius:24px;padding:32px;max-width:420px;margin:40px auto;text-align:center;"><div style="font-size:48px;margin-bottom:16px;">🌿</div><h2 style="font-family:Newsreader,serif;font-size:24px;color:#173809;margin-bottom:8px;">Analyzing Plant...</h2><p style="color:#43493e;font-size:14px;">Our AI is identifying your plant</p><div style="margin-top:24px;height:4px;background:#e5e2dd;border-radius:9999px;overflow:hidden;"><div id="prog" style="height:100%;background:#173809;border-radius:9999px;width:0%;transition:width 2s;"></div></div></div>';
  resultOverlay.style.display = "block";
  setTimeout(() => { var p = document.getElementById("prog"); if(p) p.style.width="80%"; }, 100);
}

function showResult(plant, imgSrc) {
  resultOverlay.innerHTML = '<div style="background:#fcf9f4;border-radius:24px;max-width:420px;margin:40px auto;overflow:hidden;"><img src="' + imgSrc + '" style="width:100%;height:220px;object-fit:cover;"><div style="padding:24px;"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;"><span style="background:#d2eac3;color:#566a4b;padding:4px 12px;border-radius:9999px;font-size:12px;font-weight:600;">' + (plant.family || "Plant") + '</span><span style="color:#73796d;font-size:12px;">' + (plant.confidence || 85) + '% match</span></div><h2 style="font-family:Newsreader,serif;font-size:28px;color:#173809;margin:8px 0 4px;">' + (plant.commonName || "Unknown Plant") + '</h2><p style="color:#43493e;font-size:13px;font-style:italic;margin-bottom:12px;">' + (plant.scientificName || "") + '</p><p style="color:#43493e;font-size:14px;line-height:1.6;margin-bottom:20px;">' + (plant.description || "") + '</p><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px;"><div style="background:#f0ede8;border-radius:12px;padding:12px;text-align:center;"><div style="font-size:20px;">☀️</div><div style="font-size:11px;color:#43493e;margin-top:4px;">Light</div><div style="font-size:13px;font-weight:600;color:#173809;">' + (plant.care && plant.care.light || "Moderate") + '</div></div><div style="background:#f0ede8;border-radius:12px;padding:12px;text-align:center;"><div style="font-size:20px;">💧</div><div style="font-size:11px;color:#43493e;margin-top:4px;">Water</div><div style="font-size:13px;font-weight:600;color:#173809;">' + (plant.wateringSchedule || plant.care && plant.care.water || "Weekly") + '</div></div></div><button onclick="saveAndGo(\'' + (plant.commonName || "").replace(/'/g,"") + '\',\'' + (plant.scientificName || "").replace(/'/g,"") + '\')" style="width:100%;background:#173809;color:white;border:none;padding:14px;border-radius:12px;font-size:14px;font-weight:600;cursor:pointer;margin-bottom:10px;">Add to My Garden 🌱</button><button onclick="document.getElementById(\'ai-result\').style.display=\'none\'" style="width:100%;background:#f0ede8;color:#173809;border:none;padding:14px;border-radius:12px;font-size:14px;font-weight:600;cursor:pointer;">Try Another Photo</button></div></div>';
  resultOverlay.style.display = "block";
}

function showError(msg) {
  resultOverlay.innerHTML = '<div style="background:#fcf9f4;border-radius:24px;padding:32px;max-width:420px;margin:40px auto;text-align:center;"><div style="font-size:48px;margin-bottom:16px;">😔</div><h2 style="font-family:Newsreader,serif;font-size:24px;color:#ba1a1a;">Could not identify</h2><p style="color:#43493e;font-size:14px;margin:12px 0 24px;">' + msg + '</p><button onclick="document.getElementById(\'ai-result\').style.display=\'none\'" style="background:#173809;color:white;border:none;padding:14px 32px;border-radius:12px;font-size:14px;font-weight:600;cursor:pointer;">Try Again</button></div>';
}

function saveAndGo(name, scientific) {
  try { var p=JSON.parse(localStorage.getItem("myGarden")||"[]"); p.push({name,scientific,added:new Date().toISOString()}); localStorage.setItem("myGarden",JSON.stringify(p)); } catch(e){}
  alert(name + " added to your garden!");
  window.location.href = "index.html";
}

async function identifyPlant(file) {
  showLoading();
  var reader = new FileReader();
  reader.onload = async function(e) {
    var base64 = e.target.result.split(",")[1];
    var mimeType = file.type || "image/jpeg";
    try {
      var res = await fetch("/api/identify", { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({imageBase64:base64,mimeType}) });
      var plant = await res.json();
      if (plant.error) throw new Error(plant.error);
      showResult(plant, e.target.result);
    } catch(err) {
      showError("Try a clearer photo with good lighting.");
    }
  };
  reader.readAsDataURL(file);
}

function pickFile(camera) {
  var input = document.createElement("input");
  input.type = "file"; input.accept = "image/*";
  if (camera) input.capture = "environment";
  input.onchange = function(e) { if(e.target.files[0]) identifyPlant(e.target.files[0]); };
  input.click();
}

document.addEventListener("DOMContentLoaded", function() {
  var shutter = document.querySelector(".w-16.h-16.bg-primary.rounded-full");
  var gallery = document.querySelector(".w-12.h-12.rounded-xl.bg-surface-container.overflow-hidden");
  if (shutter) shutter.addEventListener("click", function() { pickFile(true); });
  if (gallery) gallery.addEventListener("click", function() { pickFile(false); });
});
</script>
